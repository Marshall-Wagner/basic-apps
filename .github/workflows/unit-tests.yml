name: Unit tests

# Runs each app's JVM unit tests (src/test) on the plain runner. No device/emulator, no
# signing, no secrets. These are 8 independent Gradle projects; every one with tests gets
# its own parallel job. BasicCamera is omitted, it has no unit tests (CameraX/hardware only).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - BasicClock
          - BasicCalendar
          - BasicKeyboard
          - BasicPhone
          - BasicMonitor
          - BasicContacts
          - BasicSms
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # No Gradle wrapper is committed, so provision Gradle here. 8.9 is the version AGP
      # 8.7.3 targets; setup-gradle puts `gradle` on PATH and caches the build.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        working-directory: ${{ matrix.app }}
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.app }}
          path: ${{ matrix.app }}/app/build/reports/tests/
          if-no-files-found: ignore
