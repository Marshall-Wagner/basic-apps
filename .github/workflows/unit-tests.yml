name: Unit tests

# Runs each app's JVM unit tests (src/test) on the plain runner. No device/emulator, no
# signing, no secrets. These are 8 independent Gradle projects; every one with tests gets
# its own parallel job, which is now all 8. BasicCamera is mostly CameraX and cannot be
# tested off-device, but the Boost pass's gain/fade arithmetic is plain Kotlin (AudioGain)
# and is covered here.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - BasicClock
          - BasicCalendar
          - BasicKeyboard
          - BasicPhone
          - BasicMonitor
          - BasicContacts
          - BasicSms
          - BasicCamera
    steps:
      # v5 actions run on Node 24; the v4/v3 generation targets the deprecated Node 20.
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners already ship the Android SDK, so use it directly rather than the
      # third-party android-actions/setup-android action. That action began failing on an updated
      # runner image and broke every job before a single line was compiled; dropping it also
      # removes a dependency. The echoes are here so a future breakage is diagnosable from the log.
      - name: Install SDK platform and build-tools
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SDKMANAGER"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      # No Gradle wrapper is committed, so provision Gradle here. 8.9 is the version AGP
      # 8.7.3 targets; setup-gradle puts `gradle` on PATH and caches the build.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        working-directory: ${{ matrix.app }}
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report-${{ matrix.app }}
          path: ${{ matrix.app }}/app/build/reports/tests/
          if-no-files-found: ignore
